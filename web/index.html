<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Home Energy Management System - Clean, Sustainable Energy Monitoring Application">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Energy">
  <meta name="theme-color" content="#090E17">

  <title>Smart Energy - Home Energy Management System</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    body {
      background-color: #090E17;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-pulse {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00E676, #00E5FF);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 32px rgba(0, 230, 118, 0.4);
      animation: pulse 1.8s infinite ease-in-out;
    }
    .logo-pulse svg {
      width: 40px;
      height: 40px;
      fill: #042013;
    }
    .app-title {
      color: #F8FAFC;
      font-size: 22px;
      font-weight: 800;
      margin-top: 20px;
      letter-spacing: -0.5px;
    }
    .app-tagline {
      color: #94A3B8;
      font-size: 13px;
      margin-top: 6px;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); box-shadow: 0 0 16px rgba(0, 230, 118, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 36px rgba(0, 230, 118, 0.6); }
      100% { transform: scale(0.96); box-shadow: 0 0 16px rgba(0, 230, 118, 0.3); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="logo-pulse">
      <svg viewBox="0 0 24 24">
        <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C14.9 14.86 12.96 18.26 11 21z"/>
      </svg>
    </div>
    <div class="app-title">Smart Energy</div>
    <div class="app-tagline">Manage Energy, Build a Greener Future</div>
  </div>

  <!-- Universal Flutter Web entrypoint compatible with Flutter 3.10 through 3.27+ -->
  <script src="flutter_bootstrap.js" async onerror="loadLegacyFlutter()"></script>
  <script>
    function loadLegacyFlutter() {
      var script = document.createElement('script');
      script.src = 'flutter.js';
      script.defer = true;
      script.onload = function() {
        if (window._flutter && window._flutter.loader) {
          _flutter.loader.loadEntrypoint({
            serviceWorker: { serviceWorkerVersion: null },
            onEntrypointLoaded: function(engineInitializer) {
              engineInitializer.initializeEngine().then(function(appRunner) {
                var loader = document.getElementById('loading-indicator');
                if (loader) loader.remove();
                appRunner.runApp();
              });
            }
          });
        }
      };
      document.body.appendChild(script);
    }
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
